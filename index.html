<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ankit Tiwari, React.js & Node.js full stack developer in Mumbai. Building production MERN applications with secure APIs and AWS deployments."
    />
    <meta name="theme-color" content="#050508" />
    <script>
      // Apply the saved theme before first paint so there is no flash
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#f5f7fb");
        }
      } catch (e) {}
    </script>
    <meta property="og:title" content="Ankit Tiwari | Full Stack Developer" />
    <meta
      property="og:description"
      content="React.js & Node.js full stack developer building production MERN applications."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Ankit Tiwari | Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
